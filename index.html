<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mo's Kanban Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* LOGIN SCREEN */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-container h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .login-container input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .login-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-container button {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-container button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            border-left: 4px solid #c00;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* KANBAN BOARD */
        .board-container {
            display: none;
            width: 100%;
            max-width: 1400px;
        }

        .board-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .board-header h1 {
            color: #333;
            font-size: 28px;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .column {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .column-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid;
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            margin: -20px -20px 20px -20px;
            padding: 15px 20px;
        }

        .column:nth-child(1) .column-header {
            background: linear-gradient(135deg, #ee7752 0%, #e73c7e 100%);
            border-color: #e73c7e;
        }

        .column:nth-child(2) .column-header {
            background: linear-gradient(135deg, #23a6d5 0%, #23d5ab 100%);
            border-color: #23d5ab;
        }

        .column:nth-child(3) .column-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-color: #f5576c;
        }

        .column:nth-child(4) .column-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-color: #00f2fe;
        }

        .task-count {
            font-size: 12px;
            opacity: 0.8;
            margin-left: 10px;
        }

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 400px;
        }

        .task {
            background: white;
            padding: 15px;
            border-radius: 8px;
            cursor: move;
            border-left: 4px solid;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            user-select: none;
        }

        .task:nth-child(1) {
            border-left-color: #ee7752;
        }

        .task:nth-child(2) {
            border-left-color: #23a6d5;
        }

        .task:nth-child(3) {
            border-left-color: #f093fb;
        }

        .task:nth-child(4) {
            border-left-color: #4facfe;
        }

        .task:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .task.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .task.drag-over {
            background: #f0f0f0;
            border: 2px dashed #667eea;
        }

        .task-text {
            color: #333;
            font-weight: 500;
            font-size: 15px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-container" id="loginContainer">
        <h1>Kanban Board</h1>
        <p class="subtitle">Mo's Projektmanagement</p>
        <div class="error-message" id="errorMessage"></div>
        <input 
            type="password" 
            id="passwordInput" 
            placeholder="Passwort eingeben..."
            autocomplete="off"
        >
        <button onclick="handleLogin()">Anmelden</button>
    </div>

    <!-- KANBAN BOARD -->
    <div class="board-container" id="boardContainer">
        <div class="board-header">
            <h1>Mo's Kanban Board</h1>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <div class="kanban-board">
            <!-- SPALTE 1: NICHT BEGONNEN -->
            <div class="column">
                <div class="column-header">
                    Nicht begonnen
                    <span class="task-count">(<span class="count">0</span>)</span>
                </div>
                <div class="tasks" data-column="0">
                    <div class="task" draggable="true">
                        <div class="task-text">Python lernen</div>
                    </div>
                    <div class="task" draggable="true">
                        <div class="task-text">Roblox Combat Game Scripting</div>
                    </div>
                </div>
            </div>

            <!-- SPALTE 2: IN ARBEIT -->
            <div class="column">
                <div class="column-header">
                    In Arbeit
                    <span class="task-count">(<span class="count">0</span>)</span>
                </div>
                <div class="tasks" data-column="1">
                    <div class="task" draggable="true">
                        <div class="task-text">Fluglotsen-Vorbereitung (DFS)</div>
                    </div>
                </div>
            </div>

            <!-- SPALTE 3: UNDER REVIEW -->
            <div class="column">
                <div class="column-header">
                    Under Review
                    <span class="task-count">(<span class="count">0</span>)</span>
                </div>
                <div class="tasks" data-column="2">
                    <div class="task" draggable="true">
                        <div class="task-text">Clawdbot Projektmanagement</div>
                    </div>
                </div>
            </div>

            <!-- SPALTE 4: ABGESCHLOSSEN -->
            <div class="column">
                <div class="column-header">
                    Abgeschlossen
                    <span class="task-count">(<span class="count">0</span>)</span>
                </div>
                <div class="tasks" data-column="3">
                    <div class="task" draggable="true">
                        <div class="task-text">Wordle Java Game</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = 'Clawdbot-Commands_nabald';
        const LOGIN_KEY = 'kanban_authenticated';

        function handleLogin() {
            const passwordInput = document.getElementById('passwordInput');
            const password = passwordInput.value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === CORRECT_PASSWORD) {
                localStorage.setItem(LOGIN_KEY, 'true');
                showBoard();
                loadFromLocalStorage();
                errorMessage.classList.remove('show');
            } else {
                errorMessage.textContent = 'Falsches Passwort!';
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function handleLogout() {
            localStorage.removeItem(LOGIN_KEY);
            showLogin();
            document.getElementById('passwordInput').value = '';
        }

        function showLogin() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('boardContainer').style.display = 'none';
        }

        function showBoard() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('boardContainer').style.display = 'block';
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem(LOGIN_KEY) === 'true') {
                showBoard();
                loadFromLocalStorage();
            } else {
                showLogin();
                document.getElementById('passwordInput').focus();
            }
            initializeDragDrop();
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });
        });

        let draggedTask = null;

        function initializeDragDrop() {
            const tasks = document.querySelectorAll('.task');
            const taskContainers = document.querySelectorAll('.tasks');

            tasks.forEach(task => {
                task.addEventListener('dragstart', handleDragStart);
                task.addEventListener('dragend', handleDragEnd);
            });

            taskContainers.forEach(container => {
                container.addEventListener('dragover', handleDragOver);
                container.addEventListener('drop', handleDrop);
                container.addEventListener('dragleave', handleDragLeave);
            });
        }

        function handleDragStart(e) {
            draggedTask = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.tasks').forEach(container => {
                container.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            if (e.target === this) {
                this.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            
            this.classList.remove('drag-over');
            
            if (draggedTask && draggedTask.parentElement !== this) {
                this.appendChild(draggedTask);
                updateTaskCounts();
                saveToLocalStorage();
            }
            draggedTask = null;
        }

        function updateTaskCounts() {
            const columns = document.querySelectorAll('.column');
            columns.forEach(column => {
                const count = column.querySelector('.tasks').children.length;
                column.querySelector('.task-count .count').textContent = count;
            });
        }

        function saveToLocalStorage() {
            const data = [];
            document.querySelectorAll('.tasks').forEach((container) => {
                const tasks = [];
                container.querySelectorAll('.task').forEach(task => {
                    tasks.push(task.querySelector('.task-text').textContent);
                });
                data.push(tasks);
            });
            localStorage.setItem('kanban_tasks', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('kanban_tasks');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    const containers = document.querySelectorAll('.tasks');
                    
                    containers.forEach(container => {
                        container.innerHTML = '';
                    });
                    
                    data.forEach((tasks, colIndex) => {
                        tasks.forEach(taskText => {
                            const taskEl = document.createElement('div');
                            taskEl.className = 'task';
                            taskEl.draggable = true;
                            taskEl.innerHTML = `<div class="task-text">${escapeHtml(taskText)}</div>`;
                            containers[colIndex].appendChild(taskEl);
                            
                            taskEl.addEventListener('dragstart', handleDragStart);
                            taskEl.addEventListener('dragend', handleDragEnd);
                        });
                    });
                    
                    initializeDragDrop();
                    updateTaskCounts();
                } catch (e) {
                    console.error('Fehler:', e);
                }
            } else {
                updateTaskCounts();
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
